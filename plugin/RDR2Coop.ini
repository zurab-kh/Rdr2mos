; RDR2 Co-op settings. Lives next to RDR2Coop.asi in the game folder.
; Both players need the same mod version. Exactly one is "host", the other "guest".

[network]
; host  - your story is played: your missions, your world, your save progresses.
; guest - you join the host's world.
role = host

; direct - guest connects straight to the host's IP. The host must have UDP "port" reachable:
;          port forwarding on the router, or a virtual LAN (Radmin VPN, ZeroTier, Tailscale, Hamachi).
; relay  - both connect out to a relay server (rdr2coop-relay) and meet in "room". No port forwarding.
connection = direct

; direct + guest: the host's IP or hostname.   relay: the relay server's address.   (host:port also works)
address =
port = 27960

; relay only: any name you agree on with your friend. Pick something hard to guess.
room =

; 1 = connect automatically when the game has loaded; otherwise press the toggle key.
auto_connect = 0

[player]
name = Player
; The ped model your friend sees you as. Empty = Arthur (player_zero) for the host, John (player_three) for the guest.
avatar =

[sync]
; Guest sees the host's NPCs (enemies, companions, animals) instead of their own. Needed for missions.
world_sync = 1
; How far around the players NPCs are shared (metres), and at most how many.
npc_radius = 120
max_npcs = 48
; Guest's time of day follows the host.
sync_clock = 1
; Players can hurt each other.
friendly_fire = 0

[keys]
; F1..F12, a letter or a digit.
toggle = F7
teleport_to_friend = F8
hud = F9

[hud]
show = 1
