; RDR2 Co-op settings. Lives next to RDR2Coop.asi in the game folder.
; Both players need the same mod version. Exactly one is "host", the other "guest".

[network]
; host  - your story is played: your missions, your world, your save progresses.
; guest - you join the host's world.
role = host

; direct - guest connects straight to the host's IP. The host must have UDP "port" reachable:
;          port forwarding on the router, or a virtual LAN (Radmin VPN, ZeroTier, Tailscale, Hamachi).
; relay  - both connect out to a relay server (rdr2coop-relay) and meet in "room". No port forwarding.
connection = direct

; direct + guest: the host's IP or hostname.   relay: the relay server's address.   (host:port also works)
address =
port = 27960

; relay only: any name you agree on with your friend. Pick something hard to guess.
room =

; 1 = connect automatically when the game has loaded; otherwise press the toggle key.
auto_connect = 0

[player]
name = Player
; The ped model your friend sees you as. Empty = Arthur (player_zero) for the host, John (player_three) for the guest.
avatar =

[story]
; shared - both play the SAME story save. Every mission runs in both games, so you BOTH watch every
;          cutscene for real. The mod keeps the two playthroughs in step: it brings the guest to the
;          mission start, links the mission's NPCs between the games (a kill counts in both), waits
;          at the end of cutscenes for whoever is slower, and restarts the mission for both if one
;          of you dies. The guest gets the host's save with the get_host_save key (F10).
; host   - the guest only visits the host's world; missions run for the host only and the guest
;          watches the host's cutscenes through the host's camera (no animations of the actors).
mode = shared
; Whoever finishes a cutscene first waits (world paused) until the friend is done, at most barrier_timeout seconds.
cutscene_barrier = 1
barrier_timeout = 120
; If one of you dies during a mission, the mission restarts from the checkpoint for both.
shared_fail = 1
; host mode: the guest follows the host's cutscenes through the host's camera.
spectate = 1
; Share the map waypoint you set with your friend.
sync_waypoints = 1

[sync]
; Guest sees the host's world (people, animals, horses, wagons, boats) instead of their own. Needed for missions.
world_sync = 1
; How far around the players the world is shared (metres), and at most how many peds / vehicles.
; Close entities update ~15 times a second, distant and idle ones less often, so large values stay cheap.
radius = 150
max_peds = 64
max_vehicles = 16
; Guest's time of day and weather follow the host.
sync_clock = 1
sync_weather = 1
; Gently pull remote characters onto their exact path while they walk (smoother, more precise).
; Set to 0 if characters slide or stutter on your game version.
soft_correction = 1
; Guest is moved to the host when the host starts a mission or a cutscene ends, if further away than regroup_distance (m).
; During the host's cutscenes the guest cannot be hurt.
auto_regroup = 1
regroup_distance = 150
; Players can hurt each other.
friendly_fire = 0

[keys]
; F1..F12, a letter or a digit.
toggle = F7
teleport_to_friend = F8
hud = F9
; guest, shared story: copy the host's latest save into a free save slot
get_host_save = F10

[hud]
show = 1
