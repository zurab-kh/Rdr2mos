; RDR2 Co-op settings. Lives next to RDR2Coop.asi in the game folder.
; Everybody connects to one co-op server. Everyone needs the same mod version.

[network]
; Address of the co-op server (rdr2coop-server), e.g. 203.0.113.5 or my-server.example.com
server =
; 1 = run the server inside THIS game; friends then use your IP as their server address
; (UDP port must be reachable: port forwarding, or a virtual LAN such as Radmin VPN / ZeroTier / Tailscale).
host_server = 0
port = 27960
; Which campaign on the server to join. Saves and the journal are kept per campaign.
campaign = default
; Server password (if the server has one).
password =
; 1 = this player's game runs the story world (missions, NPCs). The server gives the world to a
; player who asks for it, otherwise to the first one in; when that player leaves, the next one takes over.
world_owner = 0
; 1 = connect automatically when the game has loaded; otherwise press the toggle key.
auto_connect = 0

[player]
name = Player
; The ped model the others see you as. Empty = Arthur (player_zero) for the world owner, John (player_three) otherwise.
avatar =

[story]
; Follow the server when it moves you to a mission start or back to the world owner.
auto_regroup = 1
; Host world mode: watch the world owner's cutscenes through the owner's camera.
spectate = 1
; Share the map waypoint you set with the others.
sync_waypoints = 1
; World owner: every new save you make is put on the server as the campaign save.
auto_upload_saves = 1

[sync]
; Everyone sees the world owner's world (people, animals, horses, wagons, boats). Needed for missions.
world_sync = 1
; How far around the players the world is shared (metres), and at most how many peds / vehicles.
radius = 150
max_peds = 64
max_vehicles = 16
; Time of day and weather follow the world owner.
sync_clock = 1
sync_weather = 1
; Gently pull remote characters onto their exact path while they walk. Set to 0 if characters slide.
soft_correction = 1
; Players can hurt each other.
friendly_fire = 0

[server]
; Only used with host_server = 1 (the dedicated server takes the same settings on its command line).
; shared - everyone plays the SAME story save: missions run in every game, so everybody watches
;          every cutscene for real; the server keeps the playthroughs in step.
; host   - the others visit the world owner's world; only the owner runs missions; the others watch
;          the owner's cutscenes through the owner's camera.
mode = shared
max_players = 8
; Whoever finishes a cutscene first waits (world paused) until everybody is done, at most barrier_timeout seconds.
cutscene_barrier = 1
barrier_timeout = 120
; If someone dies during a mission, the mission restarts from the checkpoint for everyone.
shared_fail = 1
; Host world: after the owner's cutscene, players farther than this (m) are brought back.
regroup_distance = 150

[keys]
; F1..F12, a letter or a digit.
toggle = F7
teleport_to_friend = F8
hud = F9
; Download the campaign save from the server into a free save slot.
download_campaign_save = F10
; Put your latest save on the server (the world owner's saves go up automatically).
upload_save = F11

[hud]
show = 1
